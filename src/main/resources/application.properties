spring.application.name=flink-boot
spring.main.web-application-type=none
spring.devtools.restart.enabled=false

# Reduce Flink's own verbose logging; use DEBUG for your own classes when needed
logging.level.org.apache.flink=WARN
logging.level.com.example=INFO

# ---------------------------------------------------------------------------
# Fraud Detection Job
# ---------------------------------------------------------------------------
fraud.job.bootstrap-servers=localhost:9092
fraud.job.transactions-topic=transactions
fraud.job.alerts-topic=fraud-alerts
fraud.job.group-id=fraud-detector

# Monetary thresholds — BigDecimal-compatible string values (no floating-point ambiguity)
fraud.job.large-transaction-threshold=50000
fraud.job.rapid-total-threshold=70000

# Rolling window duration in milliseconds (default: 1 hour)
fraud.job.rolling-window-ms=3600000

# ---------------------------------------------------------------------------
# Flink Checkpoint Storage
# Supports any URI scheme Flink understands: file://, s3://, hdfs://
# Leave blank to fall back to <java.io.tmpdir>/flink-checkpoints (safe local default)
# ---------------------------------------------------------------------------
# flink.checkpoint.dir=file:///C:/flink-checkpoints
# flink.checkpoint.dir=s3://my-bucket/flink-checkpoints
